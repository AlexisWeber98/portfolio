<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1248" height="1248" viewBox="0 0 1248 1248">
  <title>Tarjeta personal Alexis Weber — frente y dorso editables</title>
  <desc>Diseño cuadrado de presentación con dos tarjetas horizontales. Textos y elementos vectoriales editables. El QR está incrustado desde el archivo original del usuario.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop offset="0" stop-color="#25282d"/>
      <stop offset="1" stop-color="#111419"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001326"/>
      <stop offset=".55" stop-color="#000b18"/>
      <stop offset="1" stop-color="#001a35"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0878e8"/>
      <stop offset=".5" stop-color="#00c7f4"/>
      <stop offset="1" stop-color="#0878e8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#006bd8" stop-opacity="0"/>
      <stop offset=".55" stop-color="#008cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00c9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frontClip"><rect x="87" y="80" width="1074" height="505" rx="28"/></clipPath>
    <clipPath id="backClip"><rect x="87" y="647" width="1074" height="510" rx="28"/></clipPath>
    <style>
      .white { fill:#f7f9fc; font-family:Arial, Helvetica, sans-serif; }
      .cyanText { fill:#00bdf2; font-family:Arial, Helvetica, sans-serif; }
      .service { fill:#f5f7fb; font: 22px Arial, Helvetica, sans-serif; }
      .contact { fill:#f5f7fb; font: 34px Arial, Helvetica, sans-serif; }
      .small { fill:#f5f7fb; font: italic 29px Arial, Helvetica, sans-serif; }
      .icon { fill:none; stroke:#00c5f4; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <!-- Fondo de presentación -->
  <rect width="1248" height="1248" fill="url(#bg)"/>
  <rect width="1248" height="1248" fill="#ffffff" opacity=".018"/>

  <!-- FRENTE -->
  <g id="frente" aria-label="Frente de la tarjeta">
    <rect x="87" y="80" width="1074" height="505" rx="28" fill="url(#card)" stroke="#0875bd" stroke-opacity=".65" filter="url(#shadow)"/>
    <g clip-path="url(#frontClip)">
      <path d="M87 80 H420 L87 410 Z" fill="#001b38" opacity=".55"/>
      <path d="M87 80 H335 L87 330 Z" fill="url(#cyan)"/>
      <path d="M87 80 H415 L87 408 Z" fill="#0876df" opacity=".58"/>
      <path d="M87 80 H505 L87 498 Z" fill="#001a36" opacity=".75"/>
      <path d="M1090 585 L1161 514 L1161 585 Z" fill="#00baf2"/>
      <path d="M1010 585 L1161 434 L1161 514 L1090 585 Z" fill="#0878df"/>
      <rect x="110" y="485" width="1028" height="6" fill="url(#glow)"/>
    </g>

    <!-- Logo AW vectorial -->
    <g id="logo-aw" transform="translate(154 220)">
      <path d="M0 82 L66 -12 L132 82 L101 82 L66 29 L31 82 Z" fill="#f7f9fc"/>
      <path d="M93 82 L153 -12 L184 -12 L124 82 Z" fill="#00bdf2"/>
      <path d="M49 82 L66 57 L83 82 Z" fill="#00bdf2"/>
    </g>
    <path d="M459 212 V379" stroke="#00bdf2" stroke-width="3"/>
    <text x="502" y="300" class="white" font-size="76" font-weight="700">Alexis <tspan fill="#00bdf2">Weber</tspan></text>
    <text x="503" y="350" class="white" font-size="29" letter-spacing=".4">Desarrollo de Software y Soluciones Digitales</text>

    <!-- Servicios e iconos -->
    <g id="servicios">
      <!-- carrito -->
      <g class="icon" transform="translate(133 435)">
        <path d="M0 0 H12 L20 35 H57 L65 9 H17"/>
        <circle cx="27" cy="47" r="4"/><circle cx="54" cy="47" r="4"/>
      </g>
      <text x="199" y="462" class="service">E-commerce</text>
      <path d="M356 438 V478" stroke="#00bdf2" stroke-width="2.5"/>
      <!-- web -->
      <g class="icon" transform="translate(386 437)">
        <rect x="0" y="0" width="47" height="39" rx="5"/>
        <path d="M0 10 H47 M10 23 L17 28 L10 33 M28 33 L35 23"/>
        <circle cx="7" cy="5" r="1" fill="#00c5f4"/>
      </g>
      <text x="454" y="462" class="service">Desarrollo Web</text>
      <path d="M638 438 V478" stroke="#00bdf2" stroke-width="2.5"/>
      <!-- software -->
      <g class="icon" transform="translate(670 441)">
        <path d="M16 0 L2 14 L16 28 M37 0 L51 14 L37 28 M31 -3 L22 31"/>
      </g>
      <text x="738" y="462" class="service">Software</text>
      <path d="M850 438 V478" stroke="#00bdf2" stroke-width="2.5"/>
      <!-- engranaje simplificado -->
      <g class="icon" transform="translate(879 438)">
        <circle cx="22" cy="18" r="11"/>
        <path d="M22 0 V-5 M22 41 V36 M4 18 H-1 M45 18 H40 M9 5 L5 1 M39 35 L35 31 M9 31 L5 35 M39 1 L35 5"/>
        <circle cx="22" cy="18" r="18"/>
      </g>
      <text x="930" y="462" class="service">Automatizaciones</text>
    </g>
    <rect x="133" y="519" width="1000" height="3" fill="url(#cyan)"/>
  </g>

  <!-- DORSO -->
  <g id="dorso" aria-label="Dorso de la tarjeta">
    <rect x="87" y="647" width="1074" height="510" rx="28" fill="url(#card)" stroke="#0875bd" stroke-opacity=".65" filter="url(#shadow)"/>
    <g clip-path="url(#backClip)">
      <path d="M87 647 H420 L87 980 Z" fill="#001b38" opacity=".55"/>
      <path d="M87 647 H335 L87 895 Z" fill="url(#cyan)"/>
      <path d="M87 647 H415 L87 975 Z" fill="#0876df" opacity=".58"/>
      <path d="M87 647 H505 L87 1065 Z" fill="#001a36" opacity=".75"/>
      <ellipse cx="850" cy="1075" rx="420" ry="180" fill="url(#glow)"/>
      <path d="M1000 1157 L1161 996 L1161 1157 Z" fill="#00baf2"/>
      <path d="M930 1157 L1161 926 L1161 996 L1000 1157 Z" fill="#0878df"/>
    </g>

    <!-- Contactos: editar este grupo/textos en Inkscape o Illustrator -->
    <g id="datos-contacto">
      <!-- icono web -->
      <g class="icon" transform="translate(178 769)">
        <circle cx="29" cy="29" r="24"/>
        <path d="M5 29 H53 M29 5 C15 17 15 41 29 53 M29 5 C43 17 43 41 29 53"/>
      </g>
      <text x="280" y="811" class="contact">alexisweber.com</text>

      <!-- icono correo -->
      <g class="icon" transform="translate(178 846)">
        <rect x="2" y="4" width="53" height="38" rx="3"/>
        <path d="M3 7 L28 26 L54 7"/>
      </g>
      <text x="280" y="888" class="contact">contacto@alexisweber.com</text>

      <!-- icono teléfono -->
      <g class="icon" transform="translate(180 922)">
        <path d="M12 4 C7 7 6 13 9 20 C16 35 26 45 41 51 C48 54 54 50 56 44 L45 34 L36 40 C29 36 23 30 20 23 L26 15 L16 4 Z"/>
      </g>
      <text id="telefono-editable" x="280" y="965" class="contact">1135655412</text>

      <rect x="178" y="992" width="575" height="3" fill="url(#cyan)"/>
      <text x="178" y="1050" class="small">Ideas, tecnología y soluciones</text>
      <text x="178" y="1090" class="small">para <tspan fill="#00bdf2" font-weight="700">hacer crecer</tspan> tu proyecto.</text>
    </g>

    <!-- QR original: imagen incrustada sin regenerar -->
    <g id="qr-original" aria-label="Código QR original proporcionado por el usuario">
      <rect x="829" y="737" width="286" height="286" rx="17" fill="#ffffff"/>
      <image x="839" y="747" width="266" height="266"
             preserveAspectRatio="xMidYMid meet"
             xlink:href="data:image/png;base64,"/>
    </g>
  </g>
</svg>
